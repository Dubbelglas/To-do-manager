<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do Manager</title>
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/app-icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="app-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">Productivity</p>
                <h1>To-Do Manager</h1>
            </div>
            <button id="add-task" type="button" class="primary-btn add-task-btn" aria-label="Add task" title="Add task">+</button>
        </header>

        <dialog id="task-dialog" class="task-dialog" aria-labelledby="task-dialog-title">
            <section class="panel dialog-panel">
                <div class="dialog-heading">
                    <h2 id="task-dialog-title">Add task</h2>
                    <button id="close-task-dialog" type="button" class="secondary-btn close-dialog" aria-label="Close">×</button>
                </div>
            <form id="todo-form" class="todo-form">
                <label class="field field-wide" for="todo-name">
                    <span>Task</span>
                    <input id="todo-name" name="name" type="text" maxlength="160" placeholder="What needs to be done?"
                        required />
                </label>

                <label class="field" for="todo-category">
                    <span>Category</span>
                    <select id="todo-category" name="category"></select>
                </label>

                <label class="field" for="todo-priority">
                    <span>Priority</span>
                    <select id="todo-priority" name="priority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                        <option value="very-high">Very high</option>
                    </select>
                </label>

                <label class="field" for="todo-deadline">
                    <span>Deadline</span>
                    <input id="todo-deadline" name="deadline" type="date" />
                </label>

                <label class="field periodic-toggle" for="todo-periodic">
                    <span>Periodic</span>
                    <input id="todo-periodic" name="periodic" type="checkbox" />
                </label>

                <label class="field field-full" for="todo-description">
                    <span>Details</span>
                    <textarea id="todo-description" name="description" rows="3" maxlength="500"
                        placeholder="Add more detail if needed"></textarea>
                </label>

                <label id="todo-new-category-wrap" class="field field-full hidden" for="todo-new-category">
                    <span>New category</span>
                    <input id="todo-new-category" name="newCategory" type="text" maxlength="60"
                        placeholder="Type a new category name" />
                </label>

                <div class="form-actions field-full">
                    <button type="button" id="cancel-task" class="secondary-btn">Cancel</button>
                    <button type="submit" id="submit-task" class="primary-btn">Add task</button>
                </div>
            </form>
            </section>
        </dialog>

        <section class="panel toolbar" aria-label="Todo controls">
            <p id="task-summary">0 tasks left</p>

            <div class="toolbar-actions">
                <label class="sort-control" for="category-filter">
                    <span>Category</span>
                    <select id="category-filter" name="category-filter">
                        <option value="">--All--</option>
                    </select>
                </label>
                <label class="sort-control" for="sort-tasks">
                    <span>Sort</span>
                    <select id="sort-tasks" name="sort-tasks">
                        <option value="priority">Priority</option>
                        <option value="deadline">Deadline</option>
                    </select>
                </label>
                <button id="import-tasks" type="button" class="secondary-btn">Import .xlsx</button>
                <input id="import-file" type="file" accept=".xlsx,.xls,.csv" hidden />
                <button id="export-tasks" type="button" class="secondary-btn">Export .xlsx</button>
                <button id="complete-visible" type="button" class="secondary-btn">Toggle visible tasks</button>
                <button id="clear-completed" type="button" class="secondary-btn">Clear completed</button>
            </div>
        </section>

        <details class="panel task-pane" open>
            <summary class="task-pane-heading">Tasks</summary>
            <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
        </details>

        <details class="panel task-pane" open>
            <summary class="task-pane-heading">Periodiek</summary>
            <ul id="periodic-todo-list" class="todo-list" aria-live="polite"></ul>
        </details>
    </main>

    <script src="xlsx.full.min.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch((error) => {
                console.error('Unable to enable offline support:', error);
            }));
        }
    </script>
</body>

</html>
